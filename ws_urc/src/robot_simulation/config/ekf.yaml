    imu0: imu/data
    imu0_config: [false, false, false,
                    false, false, false,
                    false, false, false,
                    false, false, true,
                    false, false, false]
    imu0_differential: false  # If using a real robot you might want to set this to true, since usually absolute measurements from real imu's are not very accurate
